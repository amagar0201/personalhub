<h1>PersonalHub</h1>
<p>PersonalHub is a private, self-hosted app for one family. It runs on the family's own computer and is not offered to the public.</p>
<p>With the owner's permission it reads the owner's Gmail <b>read-only</b> to pick up bills and statements. It cannot send, delete or change email.</p>
